plugins {
    id 'com.android.application'
}

android {
    namespace 'org.rally.championship'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.rally.championship'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.1.0-android'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake {
                arguments '-DSDL_STATIC=OFF', '-DSDL_SHARED=ON',
                          '-DSDL_TEST=OFF', '-DSDL_AUDIO=ON', '-DSDL_HIDAPI=ON'
            }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/jni/CMakeLists.txt'; version '3.22.1' }
    }
    sourceSets.main.java.srcDirs += '../SDL2/android-project/app/src/main/java'
    buildTypes {
        release { signingConfig signingConfigs.debug }
    }
}
